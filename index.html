<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Meme Generator</title>
  <!-- Подключаем скрипт Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h2 {
      margin: 0;
      text-align: center;
      font-size: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #999999);
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000);
      box-sizing: border-box;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.6;
    }

    #result-container {
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    #meme-preview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h2>🔥 AI Meme Studio</h2>

  <div class="input-group">
    <label for="topic">О чём должен быть мем?</label>
    <input type="text" id="topic" placeholder="Например: Дедлайн завтра, а я сплю">
  </div>

  <div class="input-group">
    <label for="image">Загрузи картинку (необязательно)</label>
    <input type="file" id="image" accept="image/*">
  </div>

  <button class="btn" id="generate-btn" onclick="generateMeme()">✨ Сгенерировать мем</button>

  <div id="result-container">
    <img id="meme-preview" src="" alt="Сгенерированный мем">
    <button class="btn" onclick="shareMeme()">📤 Отправить в чат</button>
  </div>

  
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  async function generateMeme() {
    const topic = document.getElementById('topic').value;
    const btn = document.getElementById('generate-btn');
    const img = document.getElementById('meme-preview');
    const resultContainer = document.getElementById('result-container');
    
    if (!topic) {
      alert("Введите тему для мема!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Генерируем картинку...";
    img.style.display = 'none';

    const formData = new FormData();
    formData.append('topic', topic);

    try {
      const response = await fetch('/generate', {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      
      if (data.image_url) {
        // Устанавливаем ссылку на реальное ИИ-изображение
        img.src = data.image_url;
        img.onload = () => {
          img.style.display = 'block';
          resultContainer.style.display = 'block';
        };
      } else {
        alert("Не удалось получить изображение.");
      }
    } catch (e) {
      alert("Ошибка сервера при генерации мема!");
    } finally {
      btn.disabled = false;
      btn.innerText = "✨ Сгенерировать мем";
    }
  }

  function shareMeme() {
    const img = document.getElementById('meme-preview');
    if (img && img.src) {
      // Попытка отправить через Telegram WebApp Data
      try {
        tg.sendData(JSON.stringify({ image_url: img.src }));
      } catch (e) {}
      
      // Открываем картинку в новой вкладке/загрузке для пользователя
      window.open(img.src, '_blank');
    } else {
      alert("Сначала сгенерируйте мем!");
    }
  }
</script>


</body>
</html>
